name: yirenyoulu-v2-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: yirenyoulu_dev
      POSTGRES_USER: yirenyoulu_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an independent development password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - development_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yirenyoulu_dev -d yirenyoulu_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: [backend]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: yirenyoulu-backend:development
    environment: &backend-environment
      APP_ENV: development
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-disabled}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  planner:
    profiles: [backend]
    image: yirenyoulu-backend:development
    environment: *backend-environment
    command: [python, -m, app.worker]
    depends_on:
      db:
        condition: service_healthy
volumes:
  development_db:
