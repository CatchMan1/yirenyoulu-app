name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication guard regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Worktree, index and full reachable history
        run: python3 scripts/check_repository.py --history
