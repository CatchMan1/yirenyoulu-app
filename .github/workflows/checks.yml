name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication guard regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Worktree, index and full reachable history
        run: python3 scripts/check_repository.py --history
  database-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yirenyoulu_test
          POSTGRES_USER: integration
          # Ephemeral runner-only trust; no external published service.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d yirenyoulu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://integration@localhost:5432/yirenyoulu_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Fast tests (SQLite constraints, not PostgreSQL evidence)
        run: python -m pytest backend/tests -q
      - name: PostgreSQL migration round-trip and metadata drift
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -m pytest backend/tests/test_postgres.py -q
      - name: PostgreSQL constraints and rollback
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -m pytest backend/tests/test_schema.py -q
