name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication guard regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Worktree, index and full reachable history
        run: python3 scripts/check_repository.py --history
  database-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yirenyoulu_test
          POSTGRES_USER: integration
          # Ephemeral runner-only trust; no external published service.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d yirenyoulu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://integration@localhost:5432/yirenyoulu_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Static checks and executable contract artifacts
        run: |
          python -m ruff check --config backend/pyproject.toml backend/app backend/tests scripts/generate_response_models.py scripts/generate_harmony_models.py scripts/generate_data_dictionary.py scripts/collect_overture.py scripts/overture_transport.py scripts/import_overture.py
          python -m ruff format --check backend/app backend/tests scripts/generate_response_models.py scripts/generate_harmony_models.py scripts/generate_data_dictionary.py scripts/collect_overture.py scripts/overture_transport.py scripts/import_overture.py
          python -m mypy --config-file backend/pyproject.toml backend/app
          python scripts/generate_response_models.py --check
          python scripts/generate_harmony_models.py --check
          python scripts/generate_data_dictionary.py --check
      - name: Fast tests (SQLite constraints, not PostgreSQL evidence)
        run: python -m pytest backend/tests -q
      - name: PostgreSQL migration round-trip and metadata drift
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -m pytest backend/tests/test_postgres.py -q
      - name: PostgreSQL constraints and rollback
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -m pytest backend/tests/test_schema.py -q
      - name: PostgreSQL HTTP contract and concurrent requests
        env:
          ITERATION_HTTP_DATABASE_URL: postgresql+psycopg://integration@localhost:5432/yirenyoulu_test
        run: python -m pytest backend/tests/test_api_accounts_catalog.py backend/tests/test_api_trips.py backend/tests/test_api_tasks_chat.py backend/tests/test_api_recovery.py backend/tests/test_runtime_contract.py backend/tests/test_postgres_api_races.py backend/tests/test_recommendation_batch.py backend/tests/test_api_operations.py backend/tests/test_ingestion.py backend/tests/test_data_adapters.py backend/tests/test_data_operator.py backend/tests/test_recommendation_city.py backend/tests/test_bulk_collection.py backend/tests/test_wikidata_discovery.py backend/tests/test_bulk_cli.py backend/tests/test_bulk_country.py backend/tests/test_overture.py backend/tests/test_overture_cli.py -q
      - name: Backup restore and erasure replay
        env:
          ITERATION_HTTP_DATABASE_URL: postgresql+psycopg://integration@localhost:5432/yirenyoulu_test
          PG_DUMP_PATH: pg_dump
          PG_RESTORE_PATH: pg_restore
        run: |
          pg_dump --version
          python -m pytest backend/tests/test_restore.py -q
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build backend image and verify non-root runtime
        run: |
          docker build -f backend/Dockerfile -t yirenyoulu-ci .
          test "$(docker run --rm yirenyoulu-ci id -u)" = "10001"
          docker run --rm yirenyoulu-ci python -c "from app.main import create_application; from app.worker import main"
          docker run --rm yirenyoulu-ci python -m app.bulk_collect --help
          docker run --rm yirenyoulu-ci python -m app.bulk_country --help
          docker run --rm yirenyoulu-ci python -c "from pathlib import Path; from app.bulk_collect import load_config; load_config(Path('backend/examples/wikidata-bulk.json'))"
